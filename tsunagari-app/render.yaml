# Creates a PAID web service and persistent disk when applied in Render.
# Review pricing before applying. This file alone does not create resources.
services:
  - type: web
    name: tsunagari-sns
    runtime: node
    plan: 0.5c-512mb
    buildCommand: node build.mjs
    startCommand: node server.mjs
    healthCheckPath: /api/auth/status
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIRECTORY
        value: /var/data/tsunagari
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
    disk:
      name: tsunagari-data
      mountPath: /var/data
      sizeGB: 1
